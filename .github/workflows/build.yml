name: Build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
env:
  GH_TOKEN: ${{ github.token }}
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - run: gh release view latest -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create latest -R "$GITHUB_REPOSITORY" --title "Latest build" --notes "Auto build"
  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip # CPU only: keeps Linux packages small
      - run: npm run dist
      - name: Upload to rolling "latest" release
        shell: bash
        run: |
          files=$(ls release/Twinnow* | grep -E '\.(exe|dmg|AppImage|deb|rpm)$')
          gh release upload latest $files --clobber
  notes:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: gh release edit latest -R "$GITHUB_REPOSITORY" --notes "Auto build from ${GITHUB_SHA::7}"
