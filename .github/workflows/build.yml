name: Build exe
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run dist
      - name: Publish rolling "latest" release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Latest build" --notes "Auto build"
          gh release upload latest release/BestPhoto.exe --clobber
          gh release edit latest --notes "Автосборка из коммита ${GITHUB_SHA::7}"
